name: Windows build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned tools
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Build and verify
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Preset debug
          ./scripts/build.ps1 -Preset release
          . ./scripts/enter-dev-shell.ps1
          cmake --build --preset debug --target format-check
          if ($LASTEXITCODE -ne 0) { throw 'Formatting check failed.' }
          $sources = Get-ChildItem src,tests -Recurse -Filter *.cpp | ForEach-Object FullName
          clang-tidy -p build/debug $sources
          if ($LASTEXITCODE -ne 0) { throw 'Static analysis failed.' }
          ctest --preset debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug tests failed.' }
          ctest --preset release
          if ($LASTEXITCODE -ne 0) { throw 'Release tests failed.' }
